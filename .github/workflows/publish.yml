name: publish

on:
  push:
    tags:
      - 'v*'

# Fully automated npm publishing. Pushing a git tag like `v0.2.0` builds,
# tests, and publishes this package to npm under the @useauthio scope.
#
# AUTH — npm OIDC trusted publishing (no token). Register the trusted
# publisher once on npmjs.com: @useauthio/widgets → Settings → Trusted
# Publisher → GitHub Actions, repo `Authio-com/authio_widgets`, workflow
# `publish.yml`.
#
# `--provenance` attaches a signed build-provenance attestation. It requires
# `id-token: write` (below) + a public repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          # No registry-url: its generated .npmrc sends an empty token
          # instead of letting npm fall back to OIDC.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test (if a test script exists)
        run: |
          if node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('test')?0:1)"; then
            pnpm test
          else
            echo "no \"test\" script in package.json; skipping"
          fi
      # npm refuses token publishes unless the token carries bypass-2FA.
      # OIDC needs npm >= 11.5.1 (newer than Node 22's bundled npm) and no
      # NODE_AUTH_TOKEN in the environment.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --provenance --access public
